# ONE-TIME publish of 4.2.17 from GitHub (no Mac available). Signs the
# installers already built by "Build installers" and publishes them to
# printbridge and printbridge-updates, exactly as PUBLISH-UPDATE.command does.
# Needs two repository secrets: UPDATE_KEY (the .pem) and PUBLISH_TOKEN (a
# token that can write releases to both repositories). Delete this file and
# both secrets after it has run.

name: Publish once

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: "Run id of the successful Build installers run"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4.2.17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get the installers from the build
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: built
      - name: Put them where publish-update.js looks
        run: |
          mkdir -p "Source code/installer/dist" "Source code/installer-mac/dist"
          cp built/PrintBridge-4.2.17-windows/PrintBridgeSetup.exe "Source code/installer/dist/"
          cp built/PrintBridge-4.2.17-mac/* "Source code/installer-mac/dist/"
          ls -la "Source code/installer/dist" "Source code/installer-mac/dist"
      - name: Sign and publish
        working-directory: Source code/release
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          umask 077
          printf '%s\n' "$UPDATE_KEY" > "$RUNNER_TEMP/k.pem"
          node publish-update.js all --key "$RUNNER_TEMP/k.pem" --notes "Bucket: keep files and print them together later. 7 seconds to cancel or change a print. Printouts waiting over an hour are removed. What's new pop-up in English, Sinhala and Tamil."
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/k.pem"
